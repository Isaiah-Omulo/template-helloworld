name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      titleText:
        description: "Which text should it say?"
        required: true
        default: "Welcome to Remotion."
        type: string
      titleColor:
        description: "Which color should it be in?"
        required: true
        default: "black"
        type: string

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use your preferred Node version
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Render the video using the inputs from workflow_dispatch
      - name: Render Video
        run: |
          npx remotion render HelloWorld out/video.mp4 \
          --props='{"titleText": "${{ inputs.titleText }}", "titleColor": "${{ inputs.titleColor }}"}'

      # 5. Upload the generated video so you can download it from GitHub
      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
