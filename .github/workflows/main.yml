name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      titleText:
        description: "Which text should it say?"
        required: true
        default: "Welcome to Remotion."
        type: string
      titleColor:
        description: "Which color should it be in?"
        required: true
        default: "black"
        type: string

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Removed cache: 'npm' so it doesn't look for a lockfile

      - name: Install dependencies
        run: npm install

      - name: Render Video
        run: |
          npx remotion render HelloWorld out/video.mp4 \
          --props='{"titleText": "${{ inputs.titleText }}", "titleColor": "${{ inputs.titleColor }}"}'

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
